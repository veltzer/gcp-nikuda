gcp_configuration_name=nikuda

# Where and how the app is deployed by gcloud_run_deploy.sh (utils-bash).
gcp_service=nikuda
gcp_region=us-central1
gcp_run_args=(
	--allow-unauthenticated
	--max-instances 2
)

# Optional Dicta Nakdan support (see doc/nakdan_api.txt). Dicta asks that the
# endpoint not be published, so both it and the API key live in pass(1)
# (keys/dicta.org.il: the key, then a "url: <endpoint>" line) and are handed
# to Cloud Run at deploy time; without them the feature stays off.
if nakdan_entry=$(pass show keys/dicta.org.il 2>/dev/null)
then
	nakdan_api_key=$(head -n 1 <<< "${nakdan_entry}")
	nakdan_url=$(sed -n 's/^url: *//p' <<< "${nakdan_entry}")
	gcp_run_args+=(--update-env-vars "NAKDAN_URL=${nakdan_url},NAKDAN_API_KEY=${nakdan_api_key}")
else
	echo ".gcp.conf: no keys/dicta.org.il in pass, Nakdan support left as deployed" >&2
fi
