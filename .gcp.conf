gcp_project=veltzer-nikuda-id

# Where and how the app is deployed by gcloud_deploy.sh (utils-bash).
gcp_service=nikuda
gcp_region=us-central1
# Custom domain, mapped to the service with a Cloud Run domain mapping. The
# app gets it as CANONICAL_HOST and redirects every other hostname it is
# reached on (the run.app ones Cloud Run adds) to it.
gcp_domain=nikuda.co.il
# More hostnames the site is served on as it is, each with its own domain
# mapping; space separated. They reach the app as ALIAS_HOSTS.
gcp_alias_domains="www.nikuda.co.il"

gcp_env_vars="CANONICAL_HOST=${gcp_domain},ALIAS_HOSTS=${gcp_alias_domains}"

# Optional Dicta Nakdan support (see doc/nakdan_api.txt). Dicta asks that the
# endpoint not be published, so both it and the API key live in pass(1)
# (keys/dicta.org.il: the key, then a "url: <endpoint>" line) and are handed
# to Cloud Run at deploy time; without them the feature stays off.
if nakdan_entry=$(pass show keys/dicta.org.il 2>/dev/null)
then
	nakdan_api_key=$(head -n 1 <<< "${nakdan_entry}")
	nakdan_url=$(sed -n 's/^url: *//p' <<< "${nakdan_entry}")
	gcp_env_vars+=",NAKDAN_URL=${nakdan_url},NAKDAN_API_KEY=${nakdan_api_key}"
else
	echo ".gcp.conf: no keys/dicta.org.il in pass, Nakdan support left as deployed" >&2
fi

gcp_run_args=(
	--allow-unauthenticated
	--max-instances 2
	--update-env-vars "${gcp_env_vars}"
)
