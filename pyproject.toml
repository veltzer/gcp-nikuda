# Authoritative dependency list for this repo; `rsconstruct tool
# install-deps` and `uv sync` both read it.

[project]
name = "gcp-nikuda"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "gunicorn",
    "webtest",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-WebTest",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    "src",
    ".",
]

[tool.pytest.ini_options]
# Tests import from here: main.py lives in src/ and is not an installed package.
pythonpath = ["src"]
