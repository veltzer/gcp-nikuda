# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# requirements.txt is the App Engine deploy manifest: only scan src/ so
# test-only imports (webtest, main) stay out of production, and add
# gunicorn, which the app.yaml entrypoint invokes but no code imports.
[processor.requirements]
src_dirs = ["src"]
extra = ["gunicorn"]

# Runtime deps so CI installs what the code and tests import (the
# gcp-machines pattern).
[dependencies]
pip = [
    "flask",
    "types-WebTest",
    "webtest",
]
