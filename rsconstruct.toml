# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

[processor.checker.ruff]
src_dirs = ["src", "tests", "scripts"]


[processor.checker.pyrefly]
src_dirs = ["src", "tests", "scripts"]

[processor.checker.pytest]
src_dirs = ["tests"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

[processor.checker.itidy]
src_dirs = ["src"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.checker.idockerfile]
src_files = ["Dockerfile"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_dirs = ["db", "src/data"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
src_dirs = ["src/images"]

# ─── css ─────────────────────────────────────────────────────────────────────

# Only .css is passed: .biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.checker.biome]
src_dirs = ["src/css"]
src_extensions = [".css"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_dirs = ["src/js"]
args = ["-c", ".oxlintrc.json"]
